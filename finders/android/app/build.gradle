plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" // Uncomment this line for Firebase
}

android {
    namespace = "com.example.finders" // Make sure this matches your Firebase configuration
    compileSdk = 34 // Or use flutter.compileSdkVersion if defined

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8 // Ensure this is correctly set
    }

    defaultConfig {
        applicationId = "com.example.finders" // Should match Firebase project's application ID
        minSdkVersion 23 // Minimum SDK version
        targetSdk = 34 // Or use flutter.targetSdkVersion if defined
        versionCode = 1 // Ensure correct version
        versionName = "1.0" // App version name
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // Configure signing for release if needed
        }
    }
}

flutter {
    source = "../.." // Ensure this points to your Flutter source
}

// Uncomment and modify as necessary
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0" // Kotlin version (check for latest)
    implementation platform('com.google.firebase:firebase-bom:32.0.0') // Use BOM for Firebase
    implementation 'com.google.firebase:firebase-auth' // Firebase Auth SDK
    implementation 'com.google.firebase:firebase-core' // Firebase Core SDK (optional, but recommended)
}

apply plugin: 'com.google.gms.google-services' // Ensure Firebase services are applied
